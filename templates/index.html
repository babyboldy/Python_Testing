<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUDLFT Registration</title>
    <style>
        :root {
            --bg-1: #0f2027;
            --bg-2: #203a43;
            --bg-3: #2c5364;
            --card-bg: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.25);
            --text-primary: #f2f6f8;
            --text-secondary: #c9d6df;
            --accent: #61dafb;
            --accent-2: #00c2ff;
            --shadow: rgba(0, 0, 0, 0.35);
            --ring: rgba(97, 218, 251, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-primary);
            background: radial-gradient(1200px 800px at 10% 10%, rgba(255,255,255,0.06), transparent 40%),
                        radial-gradient(1000px 600px at 90% 30%, rgba(255,255,255,0.05), transparent 45%),
                        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 44px 36px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 24px 60px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px) saturate(140%);
            -webkit-backdrop-filter: blur(10px) saturate(140%);
            animation: cardIn 480ms cubic-bezier(.2,.7,.2,1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(14px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .icon {
            text-align: center;
            margin-bottom: 18px;
            font-size: 56px;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
        }

        h1 {
            text-align: center;
            font-size: 30px;
            letter-spacing: 0.2px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .subtitle {
            text-align: center;
            margin: 0 auto 28px;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-secondary);
            max-width: 40ch;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 13px;
            letter-spacing: .2px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 0 0 8px 2px;
        }

        input[type="email"] {
            width: 100%;
            appearance: none;
            background: rgba(255, 255, 255, 0.10);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 16px;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease, transform .08s ease;
        }

        input[type="email"]::placeholder { color: rgba(255, 255, 255, 0.55); }

        input[type="email"]:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.35);
        }

        input[type="email"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--ring);
            background: rgba(255, 255, 255, 0.14);
        }

        button {
            width: 100%;
            appearance: none;
            border: 0;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: .4px;
            color: #0b1b22;
            background: linear-gradient(135deg, #61dafb 0%, #00e0ff 45%, #00b3ff 100%);
            box-shadow: 0 10px 24px rgba(0, 179, 255, 0.35), inset 0 1px 0 rgba(255,255,255,0.5);
            cursor: pointer;
            transition: transform .08s ease, box-shadow .2s ease, filter .2s ease;
        }

        button:hover { transform: translateY(-1px); filter: brightness(1.03); }
        button:active { transform: translateY(0); filter: brightness(.98); }
        button:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring), 0 10px 24px rgba(0, 179, 255, 0.35); }

        /* Subtle divider using gradient line */
        form { position: relative; }
        form::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: -6px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            opacity: .5;
        }

        .actions { display: flex; gap: 12px; margin-top: 12px; }
        .button-link {
            display: inline-block;
            text-decoration: none;
            text-align: center;
            width: 100%;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: .4px;
            color: #0b1b22;
            background: linear-gradient(135deg, #61dafb 0%, #00e0ff 45%, #00b3ff 100%);
            box-shadow: 0 10px 24px rgba(0, 179, 255, 0.35), inset 0 1px 0 rgba(255,255,255,0.5);
            transition: transform .08s ease, box-shadow .2s ease, filter .2s ease;
        }
        .button-link:hover { transform: translateY(-1px); filter: brightness(1.03); }
        .button-link:active { transform: translateY(0); filter: brightness(.98); }
        .button-link:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring), 0 10px 24px rgba(0, 179, 255, 0.35); }

        @media (max-width: 600px) {
            .container { padding: 36px 26px; }
            h1 { font-size: 26px; }
            .subtitle { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🏋️</div>
        <h1>Welcome to GUDLFT</h1>
        <p class="subtitle">Please enter your secretary email to continue to the registration portal</p>
        
        <form action="showSummary" method="post">
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" name="email" id="email" placeholder="secretary@example.com" required/>
            </div>
            <div class="actions">
                <button type="submit">Enter Portal</button>
                <a class="button-link" href="{{ url_for('points') }}">View Club Points</a>
            </div>
        </form>
    </div>
</body>
</html>
