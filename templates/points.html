<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Points | GUDLFT</title>
    <style>
        :root {
            --bg-1: #0f2027;
            --bg-2: #203a43;
            --bg-3: #2c5364;
            --card-bg: rgba(255, 255, 255, 0.10);
            --card-border: rgba(255, 255, 255, 0.22);
            --text-primary: #f2f6f8;
            --text-secondary: #c9d6df;
            --accent: #61dafb;
            --ring: rgba(97, 218, 251, 0.35);
            --shadow: rgba(0, 0, 0, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(1200px 800px at 10% 10%, rgba(255,255,255,0.06), transparent 40%),
                radial-gradient(1000px 600px at 90% 30%, rgba(255,255,255,0.05), transparent 45%),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 24px 60px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px) saturate(140%);
            -webkit-backdrop-filter: blur(10px) saturate(140%);
            padding: 28px 26px;
            animation: cardIn 480ms cubic-bezier(.2,.7,.2,1);
        }

        @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.98);} to { opacity: 1; transform: translateY(0) scale(1);} }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        h1 { font-size: 28px; font-weight: 800; letter-spacing: .2px; color: #fff; }
        .subtitle { color: var(--text-secondary); }

        .table-wrap {
            margin-top: 16px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
        }

        table { width: 100%; border-collapse: collapse; }
        thead { background: rgba(255,255,255,0.12); }
        th, td { padding: 14px 16px; text-align: left; }
        th { font-size: 13px; letter-spacing: .3px; text-transform: uppercase; color: #e5eaee; }
        td { color: #fff; }

        tbody tr { transition: background .15s ease; }
        tbody tr:nth-child(even) { background: rgba(255,255,255,0.04); }
        tbody tr:hover { background: rgba(97, 218, 251, 0.08); }

        .rank { width: 80px; color: #e5eaee; font-weight: 700; }
        .points { font-weight: 800; color: #61dafb; }

        .actions { margin-top: 16px; display: flex; gap: 10px; }
        .btn {
            background: linear-gradient(135deg, #61dafb 0%, #00e0ff 45%, #00b3ff 100%);
            color: #0b1b22;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 800;
            letter-spacing: .3px;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(0, 179, 255, 0.30), inset 0 1px 0 rgba(255,255,255,.5);
            transition: transform .08s ease, filter .2s ease, box-shadow .2s ease;
        }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.03); }
        .btn:active { transform: translateY(0); filter: brightness(.98); }
        .btn:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring), 0 10px 24px rgba(0, 179, 255, 0.35); }

        @media (max-width: 640px) {
            .container { padding: 22px; }
            h1 { font-size: 24px; }
            th, td { padding: 12px; }
        }
    </style>
    </head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Club Points</h1>
                <p class="subtitle">Tableau public en lecture seule</p>
            </div>
            <div class="actions">
                <a class="btn" href="{{ url_for('index') }}">Accueil</a>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th class="rank">#</th>
                        <th>Club</th>
                        <th>Points disponibles</th>
                    </tr>
                </thead>
                <tbody>
                    {% for club in clubs %}
                    <tr>
                        <td class="rank">{{ loop.index }}</td>
                        <td>{{ club['name'] }}</td>
                        <td class="points">{{ club['points'] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
