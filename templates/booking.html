<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking for {{ competition['name'] }} || GUDLFT</title>
    <style>
        :root {
            --bg-1: #0f2027;
            --bg-2: #203a43;
            --bg-3: #2c5364;
            --card-bg: rgba(255, 255, 255, 0.10);
            --card-border: rgba(255, 255, 255, 0.22);
            --text-primary: #f2f6f8;
            --text-secondary: #c9d6df;
            --accent: #61dafb;
            --ring: rgba(97, 218, 251, 0.35);
            --shadow: rgba(0, 0, 0, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(1200px 800px at 10% 10%, rgba(255,255,255,0.06), transparent 40%),
                radial-gradient(1000px 600px at 90% 30%, rgba(255,255,255,0.05), transparent 45%),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 560px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 24px 60px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px) saturate(140%);
            -webkit-backdrop-filter: blur(10px) saturate(140%);
            padding: 28px 26px;
            animation: cardIn 480ms cubic-bezier(.2,.7,.2,1);
        }

        @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.98);} to { opacity: 1; transform: translateY(0) scale(1);} }

        h2 {
            margin: 0 0 8px 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: .2px;
            color: #ffffff;
        }

        .meta {
            color: var(--text-secondary);
            margin-bottom: 14px;
        }

        .messages {
            background: rgba(97, 218, 251, 0.10);
            border: 1px solid rgba(97, 218, 251, 0.35);
            padding: 12px 14px;
            margin: 12px 0 14px 0;
            border-radius: 12px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
        }
        .messages ul { list-style: none; margin: 0; padding: 0; }
        .messages li { color: var(--text-primary); font-weight: 600; padding: 4px 0; }

        form { margin-top: 12px; }

        label {
            display: block;
            font-size: 13px;
            letter-spacing: .2px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 0 0 8px 2px;
        }

        input[type="number"] {
            width: 100%;
            appearance: none;
            background: rgba(255, 255, 255, 0.10);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 16px;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease, transform .08s ease;
        }
        input[type="number"]::placeholder { color: rgba(255, 255, 255, 0.55); }
        input[type="number"]:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.35); }
        input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); background: rgba(255, 255, 255, 0.14); }

        button {
            width: 100%;
            appearance: none;
            border: 0;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: .3px;
            color: #0b1b22;
            background: linear-gradient(135deg, #61dafb 0%, #00e0ff 45%, #00b3ff 100%);
            box-shadow: 0 10px 24px rgba(0, 179, 255, 0.35), inset 0 1px 0 rgba(255,255,255,0.5);
            cursor: pointer;
            transition: transform .08s ease, box-shadow .2s ease, filter .2s ease;
        }
        button:hover { transform: translateY(-1px); filter: brightness(1.03); }
        button:active { transform: translateY(0); filter: brightness(.98); }
        button:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring), 0 10px 24px rgba(0, 179, 255, 0.35); }

        @media (max-width: 600px) {
            .container { padding: 24px; }
            h2 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{ competition['name'] }}</h2>
        <p class="meta">Places available: <strong>{{ competition['numberOfPlaces'] }}</strong></p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="messages">
            <ul>
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        {% endwith %}

        <form action="/purchasePlaces" method="post">
            <input type="hidden" name="club" value="{{ club['name'] }}">
            <input type="hidden" name="competition" value="{{ competition['name'] }}">

            <label for="places">How many places?</label>
            <input type="number" name="places" id="places" min="1" required>

            <button type="submit">Book</button>
        </form>
    </div>
</body>
</html>
